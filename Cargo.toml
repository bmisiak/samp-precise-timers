[package]
name = "samp-precise-timers"
version = "1.0.0"
authors = ["Brian Misiak <bm@net4game.com>"]
edition = "2021"
license = "LGPL-3.0-only"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
samp = { git = "https://github.com/bmisiak/samp-sdk.git", rev = "6137cc56182cc51782e59977fe4b064836efc8f8" }
# samp = { path = "../samp-rs/samp" }
slab = "0.4.4"
log = "0.4.6"
fern = { version = "0.6", features = [] }
snafu = "0.8.0"
durr = "2"

[profile.release]
lto = true
panic = "abort"
